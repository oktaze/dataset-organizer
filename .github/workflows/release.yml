name: release

# Push to `main` runs release-please: it maintains a "release PR" that
# accumulates the CHANGELOG and bumps the version in package.json +
# tauri.conf.json + Cargo.toml together. Merging that PR creates the
# `vX.Y.Z` tag + GitHub Release, which then triggers the `build` job below
# to build/sign the per-platform installers, the updater artifacts and the
# latest.json that `tauri-plugin-updater` polls. No manual version bump or
# tagging — write Conventional Commits (feat:/fix:/feat!:) and merge the PR.
on:
  push:
    branches:
      - main
  # Manual escape hatch: rebuild and (re)upload the per-platform assets onto an
  # existing release. Needed because the `build` job otherwise only runs when
  # release-please cuts a release, so a flaky/failed platform build (e.g. the
  # Linux AppImage) can't be recovered without cutting a new version. Run from
  # the branch/tag whose code matches the release's version.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build & upload assets to (e.g. v0.11.0)"
        required: true
        type: string

permissions:
  contents: write # create the release PR, tag, GitHub Release + upload assets
  pull-requests: write # open/update the release PR

jobs:
  release-please:
    runs-on: ubuntu-22.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please's release body is the changelog; append the standing
      # install/updater note underneath it (once, when a release is cut).
      - name: Append updater note to the release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          NOTE=$'\n\n---\n\n> Auto-update enabled. Each update re-downloads the full app bundle (incl. the ~63 MB Python sidecar); the WD Tagger model is unaffected. macOS builds are unsigned — on first manual install, right-click → Open.'
          BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "${BODY}${NOTE}"

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # Linux AppImage (older glibc = wider compat)
          - platform: macos-14 # Apple Silicon (arm64)
          - platform: windows-latest # Windows NSIS
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libfuse2: the AppImage bundler's linuxdeploy step needs FUSE. Newer
          # ubuntu-22.04 runner images no longer ship it, which makes
          # linuxdeploy fail ("failed to run linuxdeploy") even with
          # APPIMAGE_EXTRACT_AND_RUN=1. Install it explicitly.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential \
            curl wget file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev libfuse2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # cp312 wheels required for onnxruntime/numpy/pillow

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # pnpm 11 needs Node >= 22 (uses node:sqlite)
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Python sidecar venv
        shell: bash
        run: |
          python -m venv sidecar/.venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=sidecar/.venv/Scripts/python
          else
            PY=sidecar/.venv/bin/python
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r sidecar/requirements.txt -r sidecar/requirements-build.txt

      # Tauri's AppImage bundler fetches AppRun + linuxdeploy from GitHub with
      # no retry, so a single dropped connection fails the whole Linux build
      # (`failed to bundle project `io: Peer disconnected``). Pre-seed them
      # into the tauri cache (~/.cache/tauri) with retries; the bundler reuses
      # cached copies instead of re-downloading. Linux/AppImage only.
      - name: Pre-fetch AppImage bundler tooling (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          cache="$HOME/.cache/tauri"
          mkdir -p "$cache"
          fetch() {
            echo "Fetching $1"
            curl -fL --retry 8 --retry-delay 4 --retry-all-errors \
              --connect-timeout 30 -o "$cache/$1" "$2"
            chmod +x "$cache/$1"
          }
          fetch AppRun-x86_64 \
            https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          fetch linuxdeploy-x86_64.AppImage \
            https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage

      # The upload target: the release-please-created release on push, or the
      # tag given to workflow_dispatch when recovering a failed platform build.
      - name: Resolve target release id
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            id=$(gh release view "${{ inputs.release_tag }}" \
              --repo "$GITHUB_REPOSITORY" --json databaseId -q .databaseId)
          else
            id="${{ needs.release-please.outputs.release_id }}"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # tauri-action calls the Tauri CLI directly (not scripts/tauri.mjs),
          # so set the AppImage FUSE workaround here too.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          # Upload onto the release resolved above (release-please's on push, or
          # the dispatched tag) instead of creating a new one.
          releaseId: ${{ steps.rel.outputs.id }}
          # --verbose surfaces the bundler's underlying tool output (e.g. the
          # real linuxdeploy error) instead of a swallowed one-line failure.
          args: --verbose
